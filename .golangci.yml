version: "2"
run:
  issues-exit-code: 1
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - exhaustive
    - gochecknoinits
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - paralleltest
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unparam
    - unused
  settings:
    goconst:
      ignore-tests: true
      # Atrium used 5. The lift inlined the adrstatus status-classification
      # logic into this one package (see README "Provenance"), concentrating
      # status literals ("superseded" etc.) that Atrium had split across two
      # packages, each under the threshold. 6 keeps goconst meaningful while
      # tolerating that concentration without editing the lifted source.
      min-occurrences: 6
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 130
    exhaustive:
      default-signifies-exhaustive: true
    depguard:
      rules:
        prevent_unmaintained_packages:
          list-mode: lax
          files:
            - $all
            - "!$test"
          deny:
            - pkg: io/ioutil
              desc: deprecated; use io and os
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
          - gocyclo
          - errcheck
          - gosec
          - goconst
        path: (.+)_test\.go
      - linters:
          - lll
        path: .golangci.yml
      # Run is the CLI flag-dispatch entrypoint (lifted from Atrium's main(),
      # complexity 16 vs the threshold 15). A dispatcher is inherently branchy;
      # gocyclo stays at 15 for every other function.
      - linters:
          - gocyclo
        text: "func `Run`"
      # actrace is a CLI tool that reads files by discovered path
      # (filepath.Walk + os.ReadFile): G304 is inherent to its job. Atrium
      # suppressed gosec for internal/tools/ (where this lived) for the same
      # reason; the exclusion follows the code to internal/actrace/.
      - linters:
          - gosec
        path: internal/actrace/
