# Composite action so a private repo can share this gate org-wide without
# being public: set this repo's Settings -> Actions -> General -> Access to
# "Accessible from repositories in the organization", then any stacklok repo
# can `uses: stacklok/ac-trace@<ref>`.
#
# The binary is built from THIS action's own checked-out source
# ($GITHUB_ACTION_PATH), never `go install`-ed as a module — so the consumer
# needs no GOPRIVATE, no module-read token, and no Docker. The actrace run
# step executes in the caller's workspace (the default working directory for
# composite steps), so it scans the consumer's tree, not the action's.

name: 'ac-trace'
description: 'Acceptance-criteria traceability gate (ADR-0065): verify every verify: proof in docs/acceptance/ resolves in the tree.'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  args:
    description: 'Arguments passed to actrace. Defaults to --strict (gate: exit 1 on any landed-plan failure). Pass an empty string for report-only, or e.g. "--plan foo --strict".'
    required: false
    default: '--strict'
  working-directory:
    description: 'Directory to run actrace from — the repo root of the project being checked.'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        # Read the Go version from this action's bundled go.mod, not the
        # caller's, so the gate builds against the version it was tested with.
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build actrace
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "${{ runner.temp }}/actrace" ./cmd/actrace

    - name: Run ac-trace gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        "${{ runner.temp }}/actrace" ${{ inputs.args }}
